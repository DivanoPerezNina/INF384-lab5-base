name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Unidad 1 · Decisión 1. La política vive en .checkov.yaml:
  # bloquea los 8 checks de hard-fail-on e informa el resto.
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Checkov (versión fija)
        run: pip install checkov==3.4.5
      - name: Checkov sobre infra/
        run: checkov --config-file .checkov.yaml

  # Unidad 2 · Decisiones 1 y 2. Trivy sobre package-lock.json.
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy · informar todos los hallazgos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: '0'

      # Decisión 1: HIGH y CRITICAL bloquean.
      # Decisión 2: ignore-unfixed queda en false. Una vulnerabilidad sin versión
      # corregida también bloquea; se resuelve reemplazando la librería o con una
      # excepción con sus cuatro datos en .trivyignore y EXCEPCIONES.md.
      - name: Trivy · bloquear HIGH y CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
